version: '3.8'

services:
  # Flask API Service
  api:
    build: .
    container_name: foodsafety-api
    command: ["python", "FoodSafety_Malnutrition/api/app.py"]
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - MODELS_PATH=/app/FoodSafety_Malnutrition/models
      - DATA_PATH=/app/FoodSafety_Malnutrition/data
    volumes:
      - ./FoodSafety_Malnutrition/models:/app/FoodSafety_Malnutrition/models:ro
      - ./FoodSafety_Malnutrition/data:/app/FoodSafety_Malnutrition/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - foodsafety-net

  # Streamlit Dashboard Service
  dashboard:
    build: .
    container_name: foodsafety-dashboard
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_PORT=8501
      - MODELS_PATH=/app/FoodSafety_Malnutrition/models
      - DATA_PATH=/app/FoodSafety_Malnutrition/data
    volumes:
      - ./FoodSafety_Malnutrition/models:/app/FoodSafety_Malnutrition/models:ro
      - ./FoodSafety_Malnutrition/data:/app/FoodSafety_Malnutrition/data:ro
      - ./streamlit_app.py:/app/streamlit_app.py:ro
    restart: unless-stopped
    networks:
      - foodsafety-net
    depends_on:
      - api

  # PostgreSQL for Monitoring (optional)
  postgres:
    image: postgres:15-alpine
    container_name: foodsafety-db
    environment:
      - POSTGRES_USER=foodsafety
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=predictions_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - foodsafety-net

networks:
  foodsafety-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
